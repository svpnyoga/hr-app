<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set new password · Enterprise HR</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<script>(function(){ var t = localStorage.getItem('hr-theme'); if(t) document.documentElement.setAttribute('data-theme', t); })();</script>
</head>
<body>
<div class="auth-wrap"><div class="auth-card">
  <h1>Set a new password</h1>
  <p class="sub">Choose a new password for your account.</p>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}<div class="alert" style="{% if category=='error' %}background:var(--red-bg);color:var(--red){% endif %}">{{ message }}</div>{% endfor %}
  {% endwith %}
  <form method="post">
    <div class="field"><label>New password</label><input type="password" name="password" minlength="6" required autofocus></div>
    <button class="btn primary" type="submit" style="width:100%;justify-content:center;padding:10px">Update password</button>
  </form>
</div></div>
</body></html>
