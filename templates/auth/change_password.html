{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Change password</h1><div class="sub">Update your account password.</div></div></div>
<div class="card card-pad" style="max-width:420px">
  <form method="post">
    <div class="field" style="margin-bottom:14px"><label>Current password</label><input type="password" name="current_password" required></div>
    <div class="field" style="margin-bottom:14px"><label>New password</label><input type="password" name="new_password" minlength="6" required></div>
    <button class="btn primary" type="submit">Update password</button>
  </form>
</div>
{% endblock %}
