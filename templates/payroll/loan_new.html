{% extends "base.html" %}
{% block title %}New Loan{% endblock %}
{% block content %}
<div class="breadcrumb"><a href="{{ url_for('payroll.loans_list') }}">Employee Loans</a> / New</div>
<div class="page-head"><div><h1>New Loan</h1></div></div>

<div class="card card-pad" style="max-width:640px">
  <form method="post">
    <div class="form-grid">
      <div class="field full">
        <label>Employee <span class="req">*</span></label>
        <select name="employee_id" required>
          <option value="">— Select —</option>
          {% for e in employees %}
          <option value="{{ e.id }}" {{ 'selected' if form and form.get('employee_id')|string == e.id|string }}>{{ e.first_name }} {{ e.last_name }} ({{ e.employee_code }})</option>
          {% endfor %}
        </select>
      </div>
      <div class="field">
        <label>Loan Type <span class="req">*</span></label>
        <input type="text" name="loan_type" placeholder="e.g. Personal Loan, Salary Advance" value="{{ form.get('loan_type') if form else '' }}" required>
      </div>
      <div class="field"></div>
      <div class="field">
        <label>Amount <span class="req">*</span></label>
        <input type="number" step="0.01" min="0.01" name="amount" value="{{ form.get('amount') if form else '' }}" required>
      </div>
      <div class="field">
        <label>Monthly Installment <span class="req">*</span></label>
        <input type="number" step="0.01" min="0.01" name="monthly_installment" value="{{ form.get('monthly_installment') if form else '' }}" required>
      </div>
      <div class="field">
        <label>Start Date <span class="req">*</span></label>
        <input type="date" name="start_date" value="{{ form.get('start_date') if form else today }}" required>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn primary" type="submit">Create Loan</button>
      <a class="btn" href="{{ url_for('payroll.loans_list') }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
